# BEFORE/AFTER `agent cost` on PRs that touch the usage path (.github/scripts/cost-metrics.ts).
# Its own workflow, not a checks.yml job: jobs inside the all-green caller run with
# `contents: read` and cannot post a PR comment. Three steps on purpose:
#   measure  -> runs the PR's own code, so it never sees a token
#   comment  -> the only step handed the token; posts the body the measurement wrote
#   verdict  -> fails the job on a differing JSON, unless the PR carries `cost-metrics: intended`

name: Cost metrics

on:
  pull_request:
    # labeled/unlabeled: applying `cost-metrics: intended` re-runs the job with the new verdict.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    # The cost command's wiring in src/cli.ts is deliberately not a trigger (it does not move
    # the scan); package.json and bun.lock are, because a dependency change does.
    paths:
      - "src/usage/**"
      - "scripts/usage/fixtures.ts"
      - "test/helpers/usage_fixtures.ts"
      - "test/fixtures/usage/**"
      - "package.json"
      - "bun.lock"
      - ".github/scripts/cost-metrics.ts"
      - ".github/workflows/cost-metrics.yml"

permissions:
  contents: read
  pull-requests: write

# One measurement per PR at a time; a superseded push's numbers are stale anyway.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metrics:
    name: base vs head
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # No persisted token: the measurement step runs the PR's own code, which could read
      # it back out of .git/config. Full history so the base commit is already local.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Measure base vs head
        id: measure
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: bun .github/scripts/cost-metrics.ts measure --out "$RUNNER_TEMP/cost-metrics"

      # A fork's PR, or one Dependabot opened (whoever re-triggers it), runs with a read-only
      # token that cannot post, so the step is skipped there: the verdict below is the gate
      # and the body is already in the log and the step summary. Any other failure to post
      # fails the job.
      - name: Post the sticky PR comment
        if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: cost-metrics
          path: ${{ steps.measure.outputs.comment }}

      - name: Apply the verdict
        run: bun .github/scripts/cost-metrics.ts verdict --in "$RUNNER_TEMP/cost-metrics"
