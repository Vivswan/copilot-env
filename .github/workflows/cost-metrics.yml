# Repo-owned. BEFORE/AFTER `agent cost` numbers on PRs that touch the usage path
# (.github/scripts/cost-metrics.ts): one sticky PR comment, a failed job when the
# head's cost JSON differs from the base's. Its own workflow rather than a
# checks.yml job because jobs inside the all-green caller run with `contents: read`
# and cannot write a PR comment.
#
# Three steps on purpose: the measurement runs the PR's own code (the fixtures script,
# the cost CLI), so its process environment never carries a token; the sticky-comment
# action step is the only one handed the token, and it posts the body file the
# measurement wrote (published as its `comment` output); the verdict step then fails the
# job on a differing JSON.

name: Cost metrics

on:
  pull_request:
    # The cost command's wiring in src/cli.ts is deliberately not a trigger (it does not move
    # the scan); deno.json and deno.lock are, because dependency or permission changes do.
    paths:
      - "src/usage/**"
      - "scripts/usage_fixtures.ts"
      - "test/helpers/usage_fixtures.ts"
      - "test/fixtures/usage/**"
      - "deno.json"
      - "deno.lock"
      - ".github/scripts/cost-metrics.ts"
      - ".github/workflows/cost-metrics.yml"

permissions:
  contents: read
  pull-requests: write

# One measurement per PR at a time; a superseded push's numbers are stale anyway.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DENO_NO_UPDATE_CHECK: "1"

jobs:
  metrics:
    name: base vs head
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # No persisted token: the measurement step runs the PR's own code, which could read
      # it back out of .git/config. Full history so the base commit is already local.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .dvmrc
          cache: true

      - name: Install dependencies
        run: deno ci

      - name: Measure base vs head
        id: measure
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          deno run --allow-read --allow-write --allow-env --allow-run=git,deno
          .github/scripts/cost-metrics.ts measure --out "$RUNNER_TEMP/cost-metrics"

      # A fork's PR, or one Dependabot opened (whoever re-triggers it), runs with a read-only
      # token that cannot post, so the step is skipped there: the verdict below is the gate
      # and the body is already in the log and the step summary. Any other failure to post
      # fails the job.
      - name: Post the sticky PR comment
        if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: cost-metrics
          path: ${{ steps.measure.outputs.comment }}

      - name: Apply the verdict
        run: >-
          deno run --allow-read
          .github/scripts/cost-metrics.ts verdict --in "$RUNNER_TEMP/cost-metrics"
