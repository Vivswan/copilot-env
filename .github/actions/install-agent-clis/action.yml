# Repo-owned.

name: Install agent CLIs
description: |
  Installs the current Claude Code and Codex CLI releases with npm and proves each one runs.

  Unpinned on purpose. The tests that need these binaries exist to catch a CLI release changing the output shape our Direct probe and health checks parse, so the latest release is the one under test.

  The one install every real-CLI job runs, so no two jobs can install differently:
    - checks.yml `check`, the matrix test job (COPILOT_ENV_LIVE_CLIS)
    - checks.yml `session-log-drift` (COPILOT_ENV_LIVE_CORPUS)
    - nightly.yml `checks` (COPILOT_ENV_LIVE_CLIS)

  Each CLI is installed globally and then run with `--version`. One that does not run is uninstalled and installed once more. A second failure fails the step with the npm output attached.

  On success the log carries one `claude: <version>` line and one `codex: <version>` line.

  The caller owes bash, node, and npm on PATH, with npm's global bin directory on it too (the hosted runners ship all of these), and network to the npm registry. No inputs, no outputs, no permissions, no secrets.

runs:
  using: composite
  steps:
    # `npm install -g` can exit 0 and still drop an optional platform package (windows-latest
    # once added 3 packages instead of 4 and lost @openai/codex-win32-x64), so the CLI failing
    # at its first run is what the suite would otherwise report twenty minutes later.
    - name: Install the current Claude Code and Codex CLI releases
      shell: bash
      run: |
        install_and_verify() {
          local cli="$1" package="$2" attempt output status version
          for attempt in 1 2; do
            if [ "$attempt" = 2 ]; then
              echo "::warning::$cli does not run after installing $package; reinstalling once"
              npm uninstall -g "$package" || true
            fi
            status=0
            output="$(npm install -g "$package" 2>&1)" || status=$?
            printf '%s\n' "$output"
            [ "$status" = 0 ] || echo "npm install -g $package exited $status"
            if version="$("$cli" --version)" && [[ "$version" == *[0-9]* ]]; then
              echo "$cli: $version"
              return 0
            fi
          done
          echo "::error::$cli does not run after two installs of $package; npm output:%0A$(printf '%s\n' "$output" | tail -n 40 | awk '{printf "%s%%0A", $0}')"
          return 1
        }
        install_and_verify claude @anthropic-ai/claude-code
        install_and_verify codex @openai/codex
