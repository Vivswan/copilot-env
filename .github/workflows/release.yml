# Repo-owned release pipeline, called by the managed ci.yml on top of the
# all-green gate. Generated once by Vivswan/repo-platform and never
# overwritten by template sync. It wraps the managed release-please.yml
# machinery with this repository's release jobs:
#
# - prepare-assets runs BEFORE release-please so a broken installer pin fails
#   the run before anything is tagged. It pins install.sh/install.ps1 to the
#   pending tag (from package.json, already bumped on main by the release PR)
#   and hands them to the post-release jobs as a run artifact.
# - release-please-config.json keeps `draft: true`, so merging the release PR
#   creates a DRAFT release; the jobs below upload the assets, smoke the real
#   uploaded installers on Linux + Windows, and only then flip the release
#   live. A plain push to main releases nothing.
#
# Post-release jobs use the same token expression as the managed machinery
# (REPO_PLATFORM_TOKEN when set, github.token otherwise) so the whole
# pipeline acts under one identity.

name: Release

on:
  workflow_call:

jobs:
  prepare-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Create installer assets
        id: prepare
        run: |
          tag="v$(bun --print "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          bun .github/scripts/release-assets.ts prepare "$tag"

      - name: Validate installer assets
        env:
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          bun .github/scripts/release-assets.ts validate "$TAG"
          bash -n release-assets/install.sh
          pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw release-assets/install.ps1)) | Out-Null"

      - uses: actions/upload-artifact@v4
        with:
          name: installer-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 1

  # The managed machinery: stale-head guard + release-please, which
  # opens/updates the rolling release PR and, when that PR is merged, creates
  # the (draft) release and tag. Outputs: release_created, tag_name.
  release-please:
    needs: prepare-assets
    uses: ./.github/workflows/release-please.yml
    secrets: inherit

  upload-assets:
    name: upload release assets
    needs: [prepare-assets, release-please]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # The assets were pinned before release-please ran, from the version on
      # the tested tree. If the created tag disagrees, uploading them would
      # publish installers that fetch the wrong release -- fail instead.
      - name: Verify prepared asset tag
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          PREPARED_TAG: ${{ needs.prepare-assets.outputs.tag }}
        run: |
          if [ "$PREPARED_TAG" != "$TAG" ]; then
            echo "::error::prepared installer assets are for $PREPARED_TAG, but release-please created $TAG"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: installer-assets
          path: release-assets

      - name: Create release archive asset
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          bun .github/scripts/release-assets.ts create-archive "$TAG" "${{ github.repository }}"
          bun .github/scripts/release-assets.ts validate "$TAG"

      - name: Upload installer assets
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG" \
            release-assets/install.sh \
            release-assets/install.ps1 \
            "release-assets/copilot-env-$TAG.tar.gz" \
            --clobber

  # Post-release gate: run the REAL uploaded installer assets end to end on
  # both platforms before the draft release goes live.
  release-installer-smoke:
    name: release installer smoke / ${{ matrix.os }}
    needs: [release-please, upload-assets]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: write # draft releases are only visible to tokens with push access
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Smoke the uploaded installer asset
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}
          COPILOT_ENV_CI_INCLUDE_DRAFT_RELEASES: "1"
        run: bun .github/scripts/release-installer-smoke.ts "${{ needs.release-please.outputs.tag_name }}" "${{ github.repository }}"

  publish-release:
    name: publish release
    needs: [release-please, release-installer-smoke]
    if: >-
      ${{
        needs.release-please.outputs.release_created == 'true' &&
        needs.release-installer-smoke.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --prerelease=false --latest
