# Repo-owned release gate: the checks required before a release that run nowhere on a PR or a
# push to main. Everything that runs on a PR stays in checks.yml; this file holds only what would
# otherwise first run after the tag exists (update-release.yml's upload-assets job). The managed
# ci.yml calls it on the release-please PR and on a workflow_dispatch, where all-green blocks on
# it; nightly.yml calls it on the schedule so a break shows the next morning instead of on the
# release PR. checks.yml never calls it: ci.yml already does, and a second call runs every job
# twice.
#
#   release-assets -> the installer assets pinned to a synthetic tag and validated, the five
#                     cross-compiled binaries with dist/checksums.txt verified, every asset
#                     present at a real size, the host's binary running --help
#
# The caller's contract: workflow_call only, no inputs, no secrets, contents: read, every job
# bounded by timeout-minutes (test/utils/release_gate.test.ts).

name: Release Gate

on:
  workflow_call:

permissions:
  contents: read

env:
  DENO_NO_UPDATE_CHECK: "1"

jobs:
  # The build and validation half of update-release.yml's upload-assets job, run before any tag
  # exists. The tag is synthetic: release-assets.ts only rewrites the installers' INSTALL_REF line
  # to it and asserts the rewrite, with no network, so the version in package.json stands in for
  # the one release-please is about to cut.
  release-assets:
    name: release assets build and validation
    runs-on: ubuntu-latest
    # Five cross-compiles, each downloading its target's denort on a cold cache.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cache: true keys the DENO_DIR cache on deno.lock; the per-target
      # denort archives deno compile downloads land there too.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .dvmrc
          cache: true

      - name: Install dependencies
        run: deno install --frozen

      # Read through the repository's one version owner (src/utils/version.ts), not a second
      # package.json reader.
      - name: Name the synthetic release tag
        id: tag
        run: |
          version="$(deno eval 'import { packageVersion } from "./src/utils/version.ts"; console.log(packageVersion())')"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create installer assets
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: deno run --allow-read --allow-write --allow-env .github/scripts/release-assets.ts prepare "$TAG"

      - name: Validate installer assets
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          deno run --allow-read --allow-env .github/scripts/release-assets.ts validate "$TAG"
          bash -n release-assets/install.sh
          pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw release-assets/install.ps1)) | Out-Null"

      - name: Compile agent binaries (all targets)
        run: |
          deno task compile
          (cd dist && sha256sum -c checksums.txt)

      # scripts/compile.ts already fails the step above when a target does not compile. What only
      # this step catches is a zero-exit compile that left a stub or a truncated artifact (a denort
      # that failed to embed, a download cut short): the size floor and the host's --help run
      # expose both. The expected names come from the targets' one source of truth
      # (src/install/targets.ts), since checksums.txt lists only what compile wrote.
      - name: Prove every release asset exists and the host's runs
        run: |
          set -euo pipefail
          assets="$(deno eval 'import { RELEASE_TARGETS, releaseAssetName } from "./src/install/targets.ts"; console.log(RELEASE_TARGETS.map(releaseAssetName).join("\n"));')"
          host="$(deno eval 'import { currentReleaseTarget, releaseAssetName } from "./src/install/targets.ts"; const t = currentReleaseTarget(); if (t === null) throw new Error("no release target for this runner"); console.log(releaseAssetName(t));')"
          for asset in $assets; do
            size="$(stat -c %s "dist/$asset")"
            echo "dist/$asset: $size bytes"
            [ "$size" -gt 10000000 ] || { echo "::error::dist/$asset is $size bytes, not a compiled binary"; exit 1; }
          done
          chmod +x "dist/$host"
          "./dist/$host" --help
