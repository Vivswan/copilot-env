name: installer-sh smoke

# One install.sh scenario per call, so each runs as its OWN job on a fresh runner: scenarios
# never share rc files, and expect-wiring=false asserts absence directly. The job compiles this
# tree's host binary and points COPILOT_ENV_DOWNLOAD_BASE at it, so the real fetch/verify/
# handoff path runs against the PR's code without a published release.
on:
  workflow_call:
    inputs:
      os:
        description: Runner OS (ubuntu-latest / macos-latest).
        required: true
        type: string
      args:
        description: Flag(s) to pass to install.sh (for example "--no-shell-integration").
        required: true
        type: string
      expect-clis:
        description: true asserts the agent CLIs (claude/copilot/codex) are installed after optional setup; false asserts they are absent.
        type: boolean
        default: false
      setup-clis:
        description: >-
          true runs `agent shell --clis` after install: the three vendors'
          own installers, at their latest (no --cooldown, so no anonymous
          GitHub API read that a shared runner IP could exhaust).
        type: boolean
        default: false
      setup-launchers:
        description: true enables the launchers (`agent config set shell.launchers true`) after install.
        type: boolean
        default: false
      expect-wiring:
        description: true asserts the rc wiring is present; false asserts it is absent.
        type: boolean
        default: true
      rerun:
        description: >-
          true runs install.sh a SECOND time after the first, so the repeat
          install path must still exit 0. Same flag, same job -- no
          cross-scenario interference.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ inputs.os }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile this tree's host binary
        run: bun run build --target host

      - name: Run install.sh ${{ inputs.args }}
        run: bun .github/scripts/installer-smoke.ts run-install
        env:
          INSTALLER_ARGS: ${{ inputs.args }}
          RERUN: ${{ inputs.rerun }}
          COPILOT_ENV_DOWNLOAD_BASE: ${{ github.workspace }}/dist

      - name: Assert installer did not install optional CLIs
        run: bun .github/scripts/installer-smoke.ts assert-no-optional-clis
        env:
          INSTALLER_ARGS: ${{ inputs.args }}

      # The INSTALLED agent, not the checkout's launcher: the whole point of
      # these scenarios is that what the installer produced stands on its own.
      - name: Run agent shell --clis
        if: ${{ inputs.setup-clis }}
        run: |
          "$HOME/.copilot-env/bin/agent" shell --clis

      - name: Enable the launchers (the shell.launchers config key)
        if: ${{ inputs.setup-launchers }}
        run: |
          "$HOME/.copilot-env/bin/agent" config set shell.launchers true

      - name: Verify install.sh outcome
        run: bun .github/scripts/installer-smoke.ts verify-outcome
        env:
          INSTALLER_ARGS: ${{ inputs.args }}
          EXPECT_CLIS: ${{ inputs.expect-clis }}
          EXPECT_WIRING: ${{ inputs.expect-wiring }}
          SETUP_LAUNCHERS: ${{ inputs.setup-launchers }}
