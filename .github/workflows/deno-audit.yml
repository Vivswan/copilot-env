# This file is managed by Vivswan/repo-platform.
# Local edits are replaced on the next sync.
#
# Audits the deno dependencies against the GitHub Advisory Database with `deno audit`, the advisory coverage, since
# Dependabot's deno ecosystem does version updates only.

name: Deno Audit

on:
  pull_request:
    paths: ["**/deno.lock"]
  push:
    branches: [main]
    paths: ["**/deno.lock"]
  schedule:
    - cron: "37 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Newest audit per ref wins; a superseded run's verdict is stale anyway.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DENO_NO_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .dvmrc
      # The lockfile must be committed (red with git's own message when it is not); the two flags
      # are the fleet's audit policy:
      #   --frozen      -> a lockfile out of date with its manifest fails loudly
      #   --level high  -> a low or moderate advisory is a Dependabot bump, not a red run
      - name: Audit dependencies (deno)
        run: |
          git ls-files --error-unmatch deno.lock
          deno audit --frozen --level high
