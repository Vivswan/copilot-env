# Repo-owned checks called by the managed ci.yml inside the all-green gate. Two limits of the
# `checks` caller; a check that cannot live with them belongs in its own workflow, wired into
# the ruleset via .github/settings.yml.
#
#   jobs get no secrets, at most `contents: read`  -> a check needing either has its own workflow
#   all-green sees only the aggregate              -> a job skipped by its own `if:` does not
#                                                     fail the gate
#
# These run on every PR and push to main. The slow, environment-heavy, and network-bound jobs
# are the release gate (release-gate.yml), which ci.yml calls on the release PR and a dispatch
# and nightly.yml calls on the schedule. Never call release-gate.yml from here.

name: Checks

on:
  workflow_call:

env:
  DENO_NO_UPDATE_CHECK: "1"

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Backstop for the steps with no ceiling of their own (checkout, setup, deno ci, the lints).
    # Five minutes above the step ceilings summed with a normal setup (2 + 20 + 3 = 25), so
    # unless setup itself runs long a hung step hits its own ceiling first and its log is kept.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .dvmrc
          cache: true

      - name: Install dependencies
        run: deno ci

      # The suite's one use of a real CLI here: test/codex/codex_profile_wiring.test.ts starts the
      # installed Codex on a writer-produced named profile (its contract since profile v1 went).
      # The live-CLI files skip without their opt-ins; the release gate sets those. Same install.
      - uses: ./.github/actions/install-agent-clis

      - name: Typecheck
        if: runner.os == 'Linux'
        run: deno task typecheck

      - name: Lint + format (deno lint + deno fmt --check)
        if: runner.os == 'Linux'
        run: deno task lint

      # Test's 20 is about 2x its 6-9 min on windows-latest, the slowest leg (3-5 on the POSIX
      # legs). The lifecycle smoke's 3 is a floor: it runs under a minute everywhere.
      - name: Test
        timeout-minutes: 20
        run: deno task test

      # .github/scripts/lifecycle-smoke.ts against the fake proxy, so no Copilot auth is needed.
      - name: Start/stop + health lifecycle (fake proxy)
        timeout-minutes: 3
        env:
          COPILOT_API_ENTRY: ${{ github.workspace }}/test/copilot-api-fake.mjs
        run: >-
          deno run --allow-env --allow-read --allow-sys=homedir,hostname --allow-run
          .github/scripts/lifecycle-smoke.ts

      - name: Shell lint (shellcheck)
        if: runner.os == 'Linux'
        run: deno task lint:sh

      - name: PowerShell lint (PSScriptAnalyzer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          deno task lint:ps

  # Each install.sh scenario runs as its OWN isolated job (fresh runner, fresh
  # $HOME) via the reusable installer-sh.yml, which compiles this tree's binary
  # and installs from it. The default bootstrap path runs on both Linux and
  # macOS; optional setup variants run on one POSIX OS because the detailed
  # block/flag behavior is covered by unit tests.
  install-sh:
    name: install.sh ${{ matrix.name }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: "default"
            args: ""
            setup-clis: false
            setup-launchers: false
            expect-clis: false
            expect-wiring: true
            rerun: true
          - os: macos-latest
            name: "default"
            args: ""
            setup-clis: false
            setup-launchers: false
            expect-clis: false
            expect-wiring: true
            rerun: true
          - os: ubuntu-latest
            name: "setup-clis"
            args: ""
            setup-clis: true
            setup-launchers: false
            expect-clis: true
            expect-wiring: true
            rerun: false
          - os: ubuntu-latest
            name: "setup-launchers"
            args: ""
            setup-clis: false
            setup-launchers: true
            expect-clis: false
            expect-wiring: true
            rerun: false
          - os: ubuntu-latest
            name: "--no-shell-integration"
            args: "--no-shell-integration"
            setup-clis: false
            setup-launchers: false
            expect-clis: false
            expect-wiring: false
            rerun: false
    uses: ./.github/workflows/installer-sh.yml
    with:
      os: ${{ matrix.os }}
      args: ${{ matrix.args }}
      setup-clis: ${{ matrix.setup-clis }}
      setup-launchers: ${{ matrix.setup-launchers }}
      expect-clis: ${{ matrix.expect-clis }}
      expect-wiring: ${{ matrix.expect-wiring }}
      rerun: ${{ matrix.rerun }}

  # Windows parity: each install.ps1 scenario as its OWN isolated job via the
  # reusable installer-ps1.yml. Git + Node/npm are preinstalled on windows-latest.
  install-ps1:
    name: install.ps1 ${{ matrix.scenario.name }}
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - name: "default"
            args: ""
            setup-clis: false
            setup-launchers: false
            expect-clis: false
            expect-wiring: true
            rerun: true
          - name: "setup-clis"
            args: ""
            setup-clis: true
            setup-launchers: false
            expect-clis: true
            expect-wiring: true
            rerun: false
          - name: "-NoShellIntegration"
            args: "-NoShellIntegration"
            setup-clis: false
            setup-launchers: false
            expect-clis: false
            expect-wiring: false
            rerun: false
    uses: ./.github/workflows/installer-ps1.yml
    with:
      args: ${{ matrix.scenario.args }}
      setup-clis: ${{ matrix.scenario.setup-clis }}
      setup-launchers: ${{ matrix.scenario.setup-launchers }}
      expect-clis: ${{ matrix.scenario.expect-clis }}
      expect-wiring: ${{ matrix.scenario.expect-wiring }}
      rerun: ${{ matrix.scenario.rerun }}
