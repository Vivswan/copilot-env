# This file is managed by Vivswan/repo-platform.
# Local edits may be replaced during template updates.
#
# `deno audit` checks every locked dependency (JSR and npm, transitive
# entries included) against the GitHub Advisory Database (served through
# the npm registry's bulk advisory endpoint) and fails the run on
# findings. Dependabot's deno ecosystem does version updates only (no
# security updates), so this run is the advisory coverage: a fresh
# advisory (weekly re-scan) or a change that locks a vulnerable version
# (lockfile-touching PRs and pushes to main) becomes an immediate red
# signal.

name: Deno Audit

on:
  pull_request:
    paths: ["**/deno.lock"]
  push:
    branches: [main]
    paths: ["**/deno.lock"]
  schedule:
    - cron: "37 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Newest audit per ref wins; a superseded run's verdict is stale anyway.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DENO_NO_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc
      # Every tracked lockfile, not just the root one: the triggers above
      # fire on **/deno.lock, and a workspace can commit several.
      # '*/deno.lock' is a git pathspec, where '*' crosses '/', so it
      # matches at any depth. Without the no-lockfile guard, the weekly run
      # on a lockfile-less repo would go green having audited nothing.
      # --frozen fails loudly when a lockfile disagrees with its manifest
      # instead of auditing it as-is.
      - name: Audit dependencies (deno)
        shell: bash
        run: |
          # Listing into a file, not a process substitution feeding the
          # loop: a git failure must abort the step under -e, not read as
          # "no lockfiles" and go green having audited nothing. -z keeps
          # unusual parent-directory names lossless.
          git ls-files -z -- 'deno.lock' '*/deno.lock' > "$RUNNER_TEMP/deno-locks"
          if [ ! -s "$RUNNER_TEMP/deno-locks" ]; then
            echo "::notice::no deno.lock tracked - nothing to audit; commit a lockfile to enable advisory coverage"
            exit 0
          fi
          while IFS= read -r -d '' lock; do
            echo "auditing $lock"
            (cd "$(dirname -- "$lock")" && deno audit --frozen)
          done < "$RUNNER_TEMP/deno-locks"
