name: Bug report
description: Report a problem with copilot-env
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: |
        1. ...
        2. Expected ..., got ...
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      multiple: true
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: dropdown
    id: wiring
    attributes:
      label: Agent wiring
      description: How the affected agent is wired (`agent env` shows it).
      multiple: true
      options:
        - Local proxy
        - GitHub Copilot Direct
        - Named profile
        - Not sure / not applicable
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: copilot-env version
      description: "`agent --version`; for dev checkouts, the git commit."
    validations:
      required: true
  - type: input
    id: install-source
    attributes:
      label: How it was installed
      description: "install.sh / install.ps1, or a dev checkout"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or command output (optional)
      description: "`agent health` output, daemon logs, or a failing command's output. Redact anything that looks like a credential, token, or key."
      render: text
    validations:
      required: false
