rulesets:
  _undeclared: delete
  entries:
    - name: main
      target: branch
      enforcement: active
      conditions:
        ref_name:
          include:
            - ~DEFAULT_BRANCH
          exclude: []
      rules:
        - type: code_quality
          parameters:
            severity: warnings
        - type: code_scanning
          parameters:
            code_scanning_tools:
              - alerts_threshold: errors
                security_alerts_threshold: high_or_higher
                tool: CodeQL
        - type: copilot_code_review
          parameters:
            review_draft_pull_requests: true
            review_on_push: true
        - type: deletion
        - type: non_fast_forward
        - type: pull_request
          parameters:
            allowed_merge_methods:
              - squash
            dismiss_stale_reviews_on_push: false
            require_code_owner_review: true
            require_last_push_approval: false
            required_approving_review_count: 0
            required_review_thread_resolution: true
        - type: required_linear_history
        - type: required_status_checks
          parameters:
            do_not_enforce_on_create: true
            required_status_checks:
              - context: all-green
                integration_id: 15368
            strict_required_status_checks_policy: false
      bypass_actors:
        - actor_id: 5
          actor_type: RepositoryRole
          bypass_mode: always
    - name: non-bypassable
      target: branch
      enforcement: active
      conditions:
        ref_name:
          include:
            - ~DEFAULT_BRANCH
          exclude: []
      rules:
        - type: deletion
        - type: required_linear_history
      bypass_actors: []
    - name: pr-title
      target: branch
      enforcement: active
      conditions:
        ref_name:
          include:
            - ~DEFAULT_BRANCH
          exclude: []
      rules:
        - type: required_status_checks
          parameters:
            do_not_enforce_on_create: true
            required_status_checks:
              - context: pr-title
                integration_id: 15368
            strict_required_status_checks_policy: false
      bypass_actors:
        - actor_id: 5
          actor_type: RepositoryRole
          bypass_mode: always
    - name: release-tags
      target: tag
      enforcement: active
      conditions:
        ref_name:
          include:
            - v*
          exclude: []
      rules:
        - type: deletion
        - type: non_fast_forward
        - type: update
      bypass_actors:
        - actor_id: 5
          actor_type: RepositoryRole
          bypass_mode: always
pages:
  build_type: workflow
