# Repo-owned: written once by the fleet sync, never overwritten. Called after the all-green gate on
# every green push to main, before the release. REPLACE the no-op job with this repository's work
# (until then it spends a runner allocation per push; the contract is the central CI's all-green
# guide, "After the gate").
#   which commit  -> `inputs.sha`, the judged one: ci.yml keys main runs by commit, so two quick
#                    merges run twice, in either order
#   how to act    -> on the judged commit, idempotent, never assuming this run is the newest

name: Post Green

on:
  workflow_call:
    inputs:
      sha:
        description: The green main commit the calling run judged.
        required: true
        type: string

jobs:
  noop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          SHA: ${{ inputs.sha }}
        run: echo "post-green hook for $SHA - nothing configured"
