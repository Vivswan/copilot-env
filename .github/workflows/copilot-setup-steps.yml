# The job named exactly `copilot-setup-steps` is what GitHub runs to provision the Copilot
# coding agent's environment before a task. setup-env.sh installs the frozen deps; its deno
# comes from scripts/ensure-deno.sh, never the .dvmrc pin:
#   deno on PATH                             -> used
#   one under ${DENO_INSTALL:-$HOME/.deno}/bin -> restored to PATH, used
#   neither                                  -> the latest release, installed
# https://docs.github.com/en/copilot/customizing-copilot/customizing-the-development-environment-for-copilot-coding-agent
name: Copilot setup steps

on:
  workflow_dispatch:
  # Validate this file when it changes (it's invoked directly by the agent, not
  # by these triggers, so there's no need to run it on every push).
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize the environment
        run: bash scripts/setup-env.sh
        env:
          HUSKY: "0"
