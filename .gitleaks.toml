# Repo-owned gitleaks config, read by the CI gitleaks job (and local
# `gitleaks git` runs). Seeded once by repo-platform's template and never
# overwritten by sync, so allowlists added here survive updates.
# [extend] pulls in gitleaks' default ruleset - without it, this file
# would REPLACE the defaults and disable every stock rule.
# minVersion is honored only by binaries new enough to know it (an older
# one skips the check silently), so the CI job pins GITLEAKS_VERSION to a
# release meeting the floor.
minVersion = "8.30.1"

[extend]
useDefault = true

# Generated lockfiles: integrity hashes occasionally trip the generic
# entropy rules, and secrets do not belong in generated files.
[[allowlists]]
description = "generated lockfiles"
paths = ['''(^|/)(bun\.lock|bun\.lockb|uv\.lock|Cargo\.lock)$''']

# Add further false-positive allowlists here; for a one-off finding,
# prefer an inline "gitleaks:allow" comment on the flagged line -
# finding-level, so it never excuses future secrets in the same file.

# A known-fake GitHub-token test fixture in immutable history; an inline
# gitleaks:allow comment cannot reach an already-committed diff. Exact
# value only, so test/ stays fully scanned.
[[allowlists]]
description = "known-fake GitHub-token test fixture in immutable history"
regexTarget = "secret"
regexes = ['''^ghp_secret123$''']
