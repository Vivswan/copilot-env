# Nightly CI: written once from repo-platform's starter (files/nightly/.github/workflows/nightly.yml
# at `stable`), repo-owned from then on and never overwritten by a sync. The night runs the
# release gate (release-gate.yml): the real-CLI test files against the CURRENT claude and codex
# releases, the container suite, the floated proxy, and the session-log corpus, so a drift shows
# before the next release PR does.
#
# What a red night points at, in order of likelihood:
#   live-clis red             -> a claude or codex release changed the output shape our Direct
#                                probe, health checks, catalog writer, or session-log readers
#                                parse (the job log carries the CLI versions and the test output)
#   install-agent-clis red    -> npm could not download or install a CLI release
#   floated lifecycle red     -> the proxy package on the live registry, or its spawn
#   `deno ci` or setup red    -> the registry or the runner, not the CLIs
#   a job CANCELLED           -> a hang hit timeout-minutes; the report job reads it as red too
# The report job files one label-deduplicated tracking issue for any of these and closes it on
# the next green (repo-platform docs/nightly.md, docs/tracking-issues.md). It gates no merge; the
# same gate blocks the release PR through ci.yml.
name: Nightly

on:
  schedule:
    # A minute of its own, so the fleet's nightlies do not all land at once.
    - cron: "41 6 * * *"
  workflow_dispatch:

concurrency:
  group: nightly

permissions:
  contents: read

jobs:
  release-gate:
    uses: ./.github/workflows/release-gate.yml

  # A CANCELLED gate counts as red: hitting the timeout cancels rather than fails, and a hang
  # is exactly what a nightly exists to catch.
  report:
    needs: [release-gate]
    if: always()
    runs-on: ubuntu-latest
    # A hung reporter is the residual silence window; keep this tight.
    timeout-minutes: 5
    # issues: write is for the fuzz-issue action; an issue it creates fires no issues:opened event, so it assigns the owner itself.
    permissions:
      issues: write
    steps:
      - name: File or update the nightly issue
        if: needs.release-gate.result == 'failure' || needs.release-gate.result == 'cancelled'
        uses: Vivswan/repo-platform/actions/fuzz-issue@stable
        with:
          mode: report
          label: "nightly-failure"
          title: Nightly CI failures
          label-color: "D93F0B"
          label-description: "Automated nightly CI failure"
          stream: generic

      - name: Close the nightly issue on a green night
        if: needs.release-gate.result == 'success'
        uses: Vivswan/repo-platform/actions/fuzz-issue@stable
        with:
          mode: resolve
          label: "nightly-failure"
          stream: generic
