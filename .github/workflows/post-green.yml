# Repo-owned: seeded once by the fleet sync, never overwritten by a later sync; the contract is
# the fleet's docs/all-green.md, "After the gate". Every green push to main gets its own run of this hook, and the
# runs of neighbouring commits overlap, so a job here may finish after a newer commit's did.
#   the no-op job                  -> REPLACE it with this repository's work; it costs a runner allocation on every green push until you do
#   what a job acts on             -> the repository's current state, idempotently; never "what this commit changed", never "the newest commit"
#   a concurrency group on a job   -> keyed per commit (inputs.sha): a shared lane replaces the pending run, and the release leg needs this hook

name: Post Green

on:
  workflow_call:
    inputs:
      sha:
        description: The green main commit the calling run judged.
        required: true
        type: string

jobs:
  noop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          SHA: ${{ inputs.sha }}
        run: echo "post-green hook for $SHA - nothing configured"
