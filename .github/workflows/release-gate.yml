# Repo-owned release gate: the slow, environment-heavy, and network-bound checks that qualify a
# release but need not run on every merge. The managed ci.yml calls it on the release-please PR
# and on a manual dispatch, where all-green blocks on it; nightly.yml calls it on the schedule so
# a drift shows before the next release PR does. checks.yml never calls it: ci.yml already does,
# and a second call runs every job twice.
#
#   live-clis           -> the real-CLI test files against the current claude and codex releases:
#                          upstream-CLI parity, catalog schema drift, the session-log recorder
#   large-tree          -> the usage index and goldens over a large seeded tree
#   test-container      -> the suite under a hermetic HOME, --network=none, the real proxy cached
#   floated-lifecycle   -> the real proxy from the live registry, asserted up to auth
#   session-log-corpus  -> the corpus recorder over the real CLIs, then `agent cost` over its HOME
#
# The caller's contract: workflow_call only, no inputs, no secrets, contents: read, every job
# bounded by timeout-minutes.

name: Release Gate

on:
  workflow_call:

permissions:
  contents: read

env:
  DENO_NO_UPDATE_CHECK: "1"

jobs:
  # The real claude and codex CLIs run against the fake model endpoint
  # (test/helpers/fake_model_endpoint.ts); each opt-in below makes a missing binary a failure,
  # never a skip. Each file names its own opt-in; the Codex catalog generation and the corpus
  # recorder have only ever run on Linux, so those two stay on that leg.
  live-clis:
    name: real CLIs against the fake / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .dvmrc
          cache: true

      - name: Install dependencies
        run: deno ci

      # UNPINNED on purpose: the latest release is the drift this gate exists to catch. The
      # action's log carries the versions under test.
      - uses: ./.github/actions/install-agent-clis

      # The recorder's five turns per CLI plus a minute-boundary wait is this step's cost.
      - name: Real-CLI tests (probe shapes, catalog schema, the session-log recorder)
        timeout-minutes: 20
        env:
          COPILOT_ENV_LIVE_CLIS: "1"
          COPILOT_ENV_LIVE_CODEX: ${{ runner.os == 'Linux' && '1' || '' }}
          COPILOT_ENV_LIVE_CORPUS: ${{ runner.os == 'Linux' && '1' || '' }}
        run: >-
          deno test -P=test test/health/claude_cli_live.test.ts test/health/codex_cli_live.test.ts
          test/codex/codex_catalog_live.test.ts test/usage/usage_corpus.test.ts

  # The usage-index perf test and the goldens again over a large seeded tree (the Windows
  # runner's disk is slower, so it gets a smaller one). Only these two files: the generator's
  # own tests read the same knob and hold whole trees in memory.
  large-tree:
    name: usage index on a large tree / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .dvmrc
          cache: true

      - name: Install dependencies
        run: deno ci

      - name: Usage index on a large tree
        timeout-minutes: 25
        env:
          COPILOT_ENV_USAGE_FIXTURE_MB: ${{ runner.os == 'Windows' && '100' || '1024' }}
        run: deno test -P=test test/usage/usage_index_perf.test.ts test/usage/usage_golden.test.ts

  # Not redundant with checks.yml's matrix: the container is where the throwaway HOME comes
  # from, so this is the only run proving the suite is hermetic.
  #
  #   test-container    -> --network=none, the real proxy from the warmed cache; any network reach fails loudly
  #   floated-lifecycle -> networked, the real proxy from the live registry; asserts only up to auth
  test-container:
    name: container suite (hermetic HOME)
    runs-on: ubuntu-latest
    # Dominated by the cold image build; the suite itself runs in well under a
    # minute once the image exists.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .dvmrc
          cache: true

      # docker is preinstalled on ubuntu runners; the task prefers podman and
      # falls back, so no engine selection is needed here.
      - name: Run the suite in a container
        run: deno task test:docker

  # The one job that floats the REAL proxy against the live registry and runs the daemon to auth.
  # It asserts up to auth, not through a lifecycle: there is no credential here.
  #
  #   checks.yml lifecycle smoke -> the fake (COPILOT_API_ENTRY)                -> start/stop + health
  #   test-container             -> the real proxy, offline from the warmed cache -> the suite is hermetic
  #   floated-lifecycle          -> the real proxy, live registry                -> the float and spawn reach auth
  floated-lifecycle:
    name: floated lifecycle (real proxy)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .dvmrc
          cache: true

      - name: Install dependencies
        run: deno ci

      # No COPILOT_API_ENTRY: `agent start` resolves and runs the real proxy.
      # The runner's HOME is disposable, which is what the smoke's guard wants.
      - name: Float the proxy and assert the daemon reaches auth
        env:
          GH_TOKEN: ${{ github.token }}
        run: deno run --allow-env --allow-read --allow-run=deno .github/scripts/floated-smoke.ts

  # The session-log readers parse what the REAL Claude Code and Codex CLIs write today, so a
  # log-format drift shows here and in the recorder's end-to-end test (live-clis,
  # COPILOT_ENV_LIVE_CORPUS): this job installs the current CLI releases, drives them against a
  # fake inference backend under a throwaway HOME (scripts/usage/corpus.ts over
  # scripts/usage/corpus/), then asserts `agent cost` still sees usage from both.
  session-log-corpus:
    name: session-log format drift smoke (real CLIs, fake backend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .dvmrc
          cache: true

      - name: Install dependencies
        run: deno ci

      - uses: ./.github/actions/install-agent-clis

      # The corpus task prints one JSON summary line last and leaves a runnable
      # HOME at <out>/home. HOME moves for the `agent cost` run so nothing on the
      # runner leaks in; DENO_DIR is pinned first so the moved HOME does not also
      # move the dependency cache `deno ci` just filled.
      - name: Session-log format drift smoke (real CLIs, fake backend)
        shell: bash
        env:
          OUT: ${{ runner.temp }}/usage-corpus
        run: |
          set -euo pipefail
          summary="$(deno task usage:corpus -- --out "$OUT" | tail -n 1)"
          echo "corpus summary: $summary"
          printf '%s\n' "$summary" | jq -e '.usageLines.claude > 0 and .usageLines.codex > 0'
          DENO_DIR="$(deno info --json | jq -r .denoDir)"
          export DENO_DIR
          HOME="$OUT/home" CODEX_HOME="$OUT/home/.codex" CLAUDE_CONFIG_DIR="$OUT/home/.claude" \
            deno run -P=cli src/cli.ts cost --json --days 7 \
            | jq -e '([.claudeSessions.usageByModel[].events] | add // 0) > 0
                     and ([.codexSessions.providers[] | .usageByModel[].events] | add // 0) > 0'
