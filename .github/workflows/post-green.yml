# Repo-owned: written once by the fleet sync, never overwritten. Called
# after the all-green gate on every green push to main, before the release:
# REPLACE the no-op job with this repository's work (it uses a runner
# allocation per push until you do; the contract is in the central CI's
# all-green guide, "After the gate"). ci.yml keys main runs by commit, so
# jobs here run once per green commit and two quick merges run twice, in
# either order: act on the judged commit (`inputs.sha`), stay idempotent,
# and never assume a run is the newest.

name: Post Green

on:
  workflow_call:
    inputs:
      sha:
        description: The green main commit the calling run judged.
        required: true
        type: string

jobs:
  noop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          SHA: ${{ inputs.sha }}
        run: echo "post-green hook for $SHA - nothing configured"
