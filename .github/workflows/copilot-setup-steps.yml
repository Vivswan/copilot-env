# The job named exactly `copilot-setup-steps` is what GitHub runs to provision the Copilot
# coding agent's environment before a task. setup-bun puts the pinned bun (.bun-version) on
# PATH first; setup-env.sh then installs the frozen deps and wires the git hooks, the same
# init every checkout runs.
# https://docs.github.com/en/copilot/customizing-copilot/customizing-the-development-environment-for-copilot-coding-agent
name: Copilot setup steps

on:
  workflow_dispatch:
  # Validate this file when it changes (it's invoked directly by the agent, not
  # by these triggers, so there's no need to run it on every push).
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Initialize the environment
        run: bash scripts/setup-env.sh
        env:
          HUSKY: "0"
