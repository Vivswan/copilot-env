# Repo-owned CI checks, called by the managed ci.yml inside the all-green
# gate: every job here must pass before all-green goes green. Generated once
# by Vivswan/repo-platform and never overwritten by template
# sync, so edit freely: multiple jobs, matrices, and further local reusable
# workflows all work.
#
# Two limits from running inside the `checks` caller: jobs here get no
# secrets and are capped at the caller's permissions (contents: read), and
# all-green only sees the aggregate result, so a job skipped by its own
# `if:` does not fail the gate. A check that needs secrets, more
# permissions, or must never be skippable, belongs in its own workflow wired
# into the ruleset via .github/settings.yml.

name: Checks

on:
  workflow_call:

env:
  DENO_NO_UPDATE_CHECK: "1"

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc
          cache: true

      - name: Install dependencies
        run: deno ci

      # The installed-proxy guard (proxyInstallAssertStatus) is not wired here:
      # asserting means floating first, which would hit the npm registry and warm a
      # cache on every runner. `deno ci` already pins the proxy baseline this job
      # builds against.

      - name: Typecheck
        if: runner.os == 'Linux'
        run: deno task typecheck

      - name: Lint + format (deno lint + deno fmt --check)
        if: runner.os == 'Linux'
        run: deno task lint

      - name: Test
        run: deno task test

      # The usage-index perf test and the goldens' extra run again over a large seeded tree
      # (the Windows runner's disk is slower, so it gets a smaller one). Only these two files:
      # the generator's own tests read the same knob and hold whole trees in memory.
      - name: Usage index on a large tree
        env:
          COPILOT_ENV_USAGE_FIXTURE_MB: ${{ runner.os == 'Windows' && '100' || '1024' }}
        run: deno test -P=test test/usage_index_perf.test.ts test/usage_golden.test.ts

      # End-to-end daemon lifecycle on every OS (script: .github/scripts/lifecycle-smoke.sh):
      # default daemon start/stop/health cross-checks, managed-lifecycle idempotency, and the
      # named-profile daemon cycle -- against a fake proxy, so no Copilot auth is needed.
      # `shell: bash` runs on the Windows runner too (git-bash).
      - name: Start/stop + health lifecycle (fake proxy)
        shell: bash
        env:
          COPILOT_API_ENTRY: ${{ github.workspace }}/test/copilot-api-fake.mjs
        run: bash .github/scripts/lifecycle-smoke.sh

      - name: Shell lint (shellcheck)
        if: runner.os == 'Linux'
        run: deno task lint:sh

      - name: PowerShell lint (PSScriptAnalyzer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          deno task lint:ps

  # The same suite again, in the container. Not redundant with the matrix above:
  # the container is where the throwaway HOME comes from, so it is the only run
  # that proves the suite is genuinely hermetic rather than merely passing on a
  # machine that happens to have the right state. `--network=none` inside means
  # anything reaching for the network fails loudly instead of silently
  # depending on it.
  #
  # Always runs, never path-gated: it IS the suite, so there is no change class
  # it can safely skip. Complements the floated-lifecycle job below, which is
  # the opposite trade - networked, real proxy, narrow assertion.
  test-container:
    name: container suite (hermetic HOME)
    runs-on: ubuntu-latest
    # Dominated by the cold image build; the suite itself runs in well under a
    # minute once the image exists.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc
          cache: true

      # docker is preinstalled on ubuntu runners; the task prefers podman and
      # falls back, so no engine selection is needed here.
      - name: Run the suite in a container
        run: deno task test:docker

  # The ONLY job that runs the REAL proxy. Every other lifecycle run points
  # COPILOT_API_ENTRY at test/copilot-api-fake.mjs, so nothing else exercises
  # the float against the live registry, or the daemon's production permission
  # set against the proxy's actual dependency tree. It asserts up to auth rather
  # than through a full lifecycle: there is no credential here, so a daemon that
  # floats, spawns, and reaches provider resolution is the expected end state.
  floated-lifecycle:
    name: floated lifecycle (real proxy)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Bounded cost: only the change classes that can plausibly break the float
      # or the daemon spawn are worth a live-registry run.
      - name: Decide whether this change can affect the floated spawn
        id: scope
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"   # push/dispatch: always run
            exit 0
          fi
          changed="$(git diff --name-only "$BASE"...HEAD)"
          if printf '%s\n' "$changed" | grep -qE '^(deno\.(json|lock)|copilot-env\.config|src/proxy_float\.ts|src/copilot_api/(process|launch|sidecar|shims|paths)\.ts|src/scripts/|\.github/scripts/(floated-smoke|lifecycle-smoke)\.sh|scripts/test_docker\.ts)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no float/spawn/lockfile changes; skipping the live-registry run"
          fi

      - uses: denoland/setup-deno@v2
        if: steps.scope.outputs.run == 'true'
        with:
          deno-version-file: .dvmrc
          cache: true

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: deno ci

      # No COPILOT_API_ENTRY: `agent start` resolves and runs the real proxy.
      # The runner's HOME is disposable, which is what the smoke's guard wants.
      - name: Float the proxy and assert the daemon reaches auth
        if: steps.scope.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/floated-smoke.sh

  # The session-log readers parse what the REAL Claude Code and Codex CLIs write
  # today, so this is the one job that can catch a log-format drift: it installs
  # the current CLI releases, drives them against a fake inference backend under
  # a throwaway HOME (scripts/usage_corpus.ts), then asserts `agent cost` still
  # sees usage from both. Every step after the checkout is guarded on the corpus
  # script existing, so until that lands the job checks out and does nothing else.
  session-log-drift:
    name: session-log format drift smoke (real CLIs, fake backend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        if: hashFiles('scripts/usage_corpus.ts') != ''
        with:
          deno-version-file: .dvmrc
          cache: true

      - name: Install dependencies
        if: hashFiles('scripts/usage_corpus.ts') != ''
        run: deno ci

      - name: Install the current Claude Code and Codex CLI releases
        if: hashFiles('scripts/usage_corpus.ts') != ''
        run: npm install -g @anthropic-ai/claude-code @openai/codex

      # The corpus task prints one JSON summary line last and leaves a runnable
      # HOME at <out>/home. HOME moves for the `agent cost` run so nothing on the
      # runner leaks in; DENO_DIR is pinned first so the moved HOME does not also
      # move the dependency cache `deno ci` just filled.
      - name: Session-log format drift smoke (real CLIs, fake backend)
        if: hashFiles('scripts/usage_corpus.ts') != ''
        shell: bash
        env:
          OUT: ${{ runner.temp }}/usage-corpus
        run: |
          set -euo pipefail
          summary="$(deno task usage:corpus -- --out "$OUT" | tail -n 1)"
          echo "corpus summary: $summary"
          printf '%s\n' "$summary" | jq -e '.usageLines.claude > 0 and .usageLines.codex > 0'
          DENO_DIR="$(deno info --json | jq -r .denoDir)"
          export DENO_DIR
          HOME="$OUT/home" CODEX_HOME="$OUT/home/.codex" CLAUDE_CONFIG_DIR="$OUT/home/.claude" \
            deno run -P=cli src/cli.ts cost --json --days 7 \
            | jq -e '([.claudeSessions.usageByModel[].events] | add // 0) > 0
                     and ([.codexSessions.providers[] | .usageByModel[].events] | add // 0) > 0'

  # Each install.sh scenario runs as its OWN isolated job (fresh runner, fresh
  # $HOME) via the reusable installer-sh.yml, which compiles this tree's binary
  # and installs from it. The default bootstrap path runs on both Linux and
  # macOS; optional setup variants run on one POSIX OS because the detailed
  # block/flag behavior is covered by unit tests.
  install-sh:
    name: install.sh ${{ matrix.name }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: "default"
            args: ""
            setup-clis: false
            setup-launchers: false
            expect-clis: false
            expect-wiring: true
            rerun: true
          - os: macos-latest
            name: "default"
            args: ""
            setup-clis: false
            setup-launchers: false
            expect-clis: false
            expect-wiring: true
            rerun: true
          - os: ubuntu-latest
            name: "setup-clis"
            args: ""
            setup-clis: true
            setup-launchers: false
            expect-clis: true
            expect-wiring: true
            rerun: false
          - os: ubuntu-latest
            name: "setup-launchers"
            args: ""
            setup-clis: false
            setup-launchers: true
            expect-clis: false
            expect-wiring: true
            rerun: false
          - os: ubuntu-latest
            name: "--no-shell-integration"
            args: "--no-shell-integration"
            setup-clis: false
            setup-launchers: false
            expect-clis: false
            expect-wiring: false
            rerun: false
    uses: ./.github/workflows/installer-sh.yml
    with:
      os: ${{ matrix.os }}
      args: ${{ matrix.args }}
      setup-clis: ${{ matrix.setup-clis }}
      setup-launchers: ${{ matrix.setup-launchers }}
      expect-clis: ${{ matrix.expect-clis }}
      expect-wiring: ${{ matrix.expect-wiring }}
      rerun: ${{ matrix.rerun }}

  # Windows parity: each install.ps1 scenario as its OWN isolated job via the
  # reusable installer-ps1.yml. Git + Node/npm are preinstalled on windows-latest.
  install-ps1:
    name: install.ps1 ${{ matrix.scenario.name }}
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - name: "default"
            args: ""
            setup-clis: false
            setup-launchers: false
            expect-clis: false
            expect-wiring: true
            rerun: true
          - name: "setup-clis"
            args: ""
            setup-clis: true
            setup-launchers: false
            expect-clis: true
            expect-wiring: true
            rerun: false
          - name: "-NoShellIntegration"
            args: "-NoShellIntegration"
            setup-clis: false
            setup-launchers: false
            expect-clis: false
            expect-wiring: false
            rerun: false
    uses: ./.github/workflows/installer-ps1.yml
    with:
      args: ${{ matrix.scenario.args }}
      setup-clis: ${{ matrix.scenario.setup-clis }}
      setup-launchers: ${{ matrix.scenario.setup-launchers }}
      expect-clis: ${{ matrix.scenario.expect-clis }}
      expect-wiring: ${{ matrix.scenario.expect-wiring }}
      rerun: ${{ matrix.scenario.rerun }}
