# Nightly CI: written once from repo-platform's starter (files/nightly/.github/workflows/nightly.yml
# at `stable`), repo-owned from then on and never overwritten by a sync. Two jobs are this
# repository's. `checks`: the CURRENT claude and codex releases against the fake model endpoint
# (test/helpers/fake_model_endpoint.ts), no credential and no network past the installs.
# `release-gate`: release-gate.yml, the checks required before a release that run nowhere on PRs
# or main, so a break there shows the next morning instead of on the release PR.
#
# What a red night points at, in order of likelihood:
#   checks: the test step red     -> a claude or codex release changed the output shape our Direct
#                                    probe and health checks parse (the `nightly-evidence` artifact
#                                    holds the CLI versions and the test log)
#   checks: the install step red  -> npm could not download or install a CLI release; the versions
#                                    were never recorded, so there is no artifact
#   release-assets red            -> a cross-compile target, a bun runtime download, or the installer
#                                    pinning (release-gate.yml names the steps)
#   `bun install` or setup red    -> the registry or the runner, not the CLIs
#   a job CANCELLED               -> a hang hit timeout-minutes; the report job reads it as red too
# The report job files one label-deduplicated tracking issue for any of these and closes it on
# the next green (repo-platform docs/nightly.md, docs/tracking-issues.md). It gates no merge; the
# same tests run inside checks.yml on every PR against that day's releases, and the same gate
# blocks the release PR through ci.yml.
name: Nightly

on:
  schedule:
    # A minute of its own, so the fleet's nightlies do not all land at once.
    - cron: "41 6 * * *"
  workflow_dispatch:

concurrency:
  group: nightly

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # UNPINNED on purpose: the latest release is the drift this run exists to catch. The same
      # install checks.yml runs, so the nightly and the PR gate never install differently.
      - uses: ./.github/actions/install-agent-clis

      - name: Record the CLI versions under test
        run: |
          mkdir -p nightly-evidence
          { echo "claude: $(claude --version)"; echo "codex: $(codex --version)"; } | tee nightly-evidence/cli-versions.txt

      # Opted in: a missing binary is a failure, never a skip that lets the night pass vacuously.
      # A hard timeout well under the job's: a hung CLI turns into a red, not a 60-minute hang
      # (a job killed at timeout-minutes is CANCELLED, which the report job also reads as red).
      - name: Run the real-CLI tests against the fake model endpoint
        env:
          COPILOT_ENV_LIVE_CLIS: "1"
        run: |
          set -o pipefail
          timeout --kill-after=30 10m bun run test test/health/claude_cli_live.e2e.test.ts test/health/codex_cli_live.e2e.test.ts 2>&1 \
            | tee nightly-evidence/test-log.txt

      # The tracking issue links this run; the run carries the evidence.
      - name: Upload the CLI versions and the test log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-evidence
          path: nightly-evidence/
          if-no-files-found: ignore

  release-gate:
    uses: ./.github/workflows/release-gate.yml

  # A CANCELLED job counts as red: hitting the timeout cancels rather than fails, and a hang is
  # exactly what a nightly exists to catch. The issue opens when either job is red and resolves
  # only when both are green.
  report:
    needs: [checks, release-gate]
    if: always()
    runs-on: ubuntu-latest
    # A hung reporter is the residual silence window; keep this tight.
    timeout-minutes: 5
    # issues: write is for the fuzz-issue action; an issue it creates fires no issues:opened event, so it assigns the owner itself.
    permissions:
      issues: write
    steps:
      - name: File or update the nightly issue
        if: >-
          needs.checks.result == 'failure' || needs.checks.result == 'cancelled' ||
          needs.release-gate.result == 'failure' || needs.release-gate.result == 'cancelled'
        uses: Vivswan/repo-platform/actions/fuzz-issue@stable
        with:
          mode: report
          label: "nightly-failure"
          title: Nightly CI failures
          label-color: "D93F0B"
          label-description: "Automated nightly CI failure"
          stream: generic

      - name: Close the nightly issue on a green night
        if: needs.checks.result == 'success' && needs.release-gate.result == 'success'
        uses: Vivswan/repo-platform/actions/fuzz-issue@stable
        with:
          mode: resolve
          label: "nightly-failure"
          stream: generic
