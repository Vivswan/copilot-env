# Repo-owned release gate: the checks required before a release that run nowhere on PRs or
# pushes to main. Everything that runs on every PR stays in checks.yml; this file holds only what
# would otherwise first run after the tag exists (update-release.yml's upload-assets job) or only
# on a push to main (the path-filtered floated lifecycle). The managed ci.yml calls it on the
# release-please PR and on a manual dispatch, where all-green blocks on it; nightly.yml calls it
# on the schedule so a break shows the next morning instead of on the release PR. checks.yml
# never calls it: ci.yml already does, and a second call runs every job twice.
#
#   release-assets    -> the installer assets pinned to a synthetic tag and validated, the five
#                        cross-compiled binaries with dist/checksums.txt verified, every asset
#                        present at a real size, the host's binary running --help
#   floated-lifecycle -> the real proxy from the live registry, asserted up to auth; checks.yml
#                        runs the same smoke path-filtered on PRs, so this is the unconditional run
#
# The caller's contract: workflow_call only, no inputs, no secrets, contents: read, every job
# bounded by timeout-minutes (test/utils/release_gate.test.ts).

name: Release Gate

on:
  workflow_call:

permissions:
  contents: read

env:
  DENO_NO_UPDATE_CHECK: "1"

jobs:
  # The build and validation half of update-release.yml's upload-assets job, run before any tag
  # exists. The tag is synthetic: release-assets.ts only rewrites the installers' INSTALL_REF line
  # to it and asserts the rewrite, with no network, so the version in package.json stands in for
  # the one release-please is about to cut.
  release-assets:
    name: release assets build and validation
    runs-on: ubuntu-latest
    # Five cross-compiles, each downloading its target's denort on a cold cache.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cache: true keys the DENO_DIR cache on deno.lock; the per-target
      # denort archives deno compile downloads land there too.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .dvmrc
          cache: true

      - name: Install dependencies
        run: deno install --frozen

      - name: Name the synthetic release tag
        id: tag
        run: echo "tag=v$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Create installer assets
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: deno run --allow-read --allow-write --allow-env .github/scripts/release-assets.ts prepare "$TAG"

      - name: Validate installer assets
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          deno run --allow-read --allow-env .github/scripts/release-assets.ts validate "$TAG"
          bash -n release-assets/install.sh
          pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw release-assets/install.ps1)) | Out-Null"

      - name: Compile agent binaries (all targets)
        run: |
          deno task compile
          (cd dist && sha256sum -c checksums.txt)

      # checksums.txt lists whatever compile produced, so a target that never compiled is absent
      # from it rather than wrong in it: the expected names come from the targets' one source of
      # truth (src/install/targets.ts) instead. A denort that failed to embed leaves a stub well
      # under the floor; the host's binary also has to start.
      - name: Prove every release asset exists and the host's runs
        run: |
          set -euo pipefail
          assets="$(deno eval 'import { RELEASE_TARGETS, releaseAssetName } from "./src/install/targets.ts"; console.log(RELEASE_TARGETS.map(releaseAssetName).join("\n"));')"
          host="$(deno eval 'import { currentReleaseTarget, releaseAssetName } from "./src/install/targets.ts"; const t = currentReleaseTarget(); if (t === null) throw new Error("no release target for this runner"); console.log(releaseAssetName(t));')"
          for asset in $assets; do
            size="$(stat -c %s "dist/$asset")"
            echo "dist/$asset: $size bytes"
            [ "$size" -gt 10000000 ] || { echo "::error::dist/$asset is $size bytes, not a compiled binary"; exit 1; }
          done
          chmod +x "dist/$host"
          "./dist/$host" --help

  # The one job that floats the REAL proxy against the live registry and runs the daemon to auth.
  # It asserts up to auth, not through a lifecycle: there is no credential here.
  #
  #   checks.yml lifecycle smoke     -> the fake (COPILOT_API_ENTRY)                 -> start/stop + health
  #   checks.yml test-container      -> the real proxy, offline from the warmed cache -> the suite is hermetic
  #   checks.yml floated-lifecycle   -> the real proxy, live registry, path-filtered  -> a PR that can break the float
  #   this floated-lifecycle         -> the real proxy, live registry, unconditional  -> the release and the night
  floated-lifecycle:
    name: floated lifecycle (real proxy)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .dvmrc
          cache: true

      - name: Install dependencies
        run: deno ci

      # No COPILOT_API_ENTRY: `agent start` resolves and runs the real proxy.
      # The runner's HOME is disposable, which is what the smoke's guard wants.
      - name: Float the proxy and assert the daemon reaches auth
        env:
          GH_TOKEN: ${{ github.token }}
        run: deno run --allow-env --allow-read --allow-run=deno .github/scripts/floated-smoke.ts
