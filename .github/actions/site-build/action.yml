# Repo-owned: seeded once by the fleet sync, never overwritten by a later sync.

name: Site Build
description: >-
  Builds this repository's own website for the fleet's Pages deploy and names
  the directory to publish.

  Today a no-op. It names no directory, so docs/ publishes alone.

  A website build replaces the step below with its toolchain setup and build
  command. Contract and examples: the fleet's docs/modules/site.md.

  The caller is the fleet's reusable-site.yml, which the managed ci.yml `site`
  leg calls on every green main run. It runs this action as a step of the
  deploy job, from the checkout of the judged commit, and hands `dist` to the
  fleet's assembly in the same workspace.

  Runs under the deploy job's token: contents read, pages and id-token write,
  issues write. A composite action declares no permissions of its own, which
  is why only code from the judged commit may run here.

  The caller owes both inputs, derived from the repository name, and a
  checkout of the judged commit. Nothing is installed beforehand. A build
  brings its own setup steps.

  A `dist` the fleet refuses, turning the leg red with the path named:
    - one that is not slash-joined segments of letters, digits, dots, underscores, and dashes
    - one with an empty, `.`, or `..` segment, which rules out `./dist`,
      `dist/`, and an absolute path
    - a missing directory
    - a symlink resolving outside the repository
    - one without an `index.html`

inputs:
  base-path:
    description: The URL path the site is served under, "/<repo>/".
    required: true
  origin:
    description: The site's origin, "https://<owner>.github.io" with the owner lowercased.
    required: true

outputs:
  dist:
    description: The built site's directory, relative to the repository root and holding an index.html, or empty for no repository website.
    value: ${{ steps.build.outputs.dist }}

runs:
  using: composite
  steps:
    # A repository with a website replaces the no-op step below with its toolchain setup and, for example:
    #   - id: build
    #     shell: bash
    #     env: {PAGES_BASE_PATH: "${{ inputs.base-path }}", PAGES_ORIGIN: "${{ inputs.origin }}"}
    #     run: |
    #       <your build command>
    #       echo "dist=<the built site directory>" >> "$GITHUB_OUTPUT"
    - id: build
      shell: bash
      run: |
        echo "site-build hook: no repository site configured; docs/ publishes alone when present"
        echo "dist=" >> "$GITHUB_OUTPUT"
