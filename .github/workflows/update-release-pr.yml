# The release-PR hook of the release pipeline: repo-owned, written once by
# the fleet sync and never overwritten. The fleet release pipeline (ci.yml's
# update-release-pr job) calls this workflow whenever release-please
# creates or refreshes the release PR (independently of any release cut),
# so everything this repository wants on that PR happens here: regenerating
# files that must ride in the release commit, updating version references
# in docs. Add jobs freely - releases never wait on this path.
# Token caveat: pushes made with the default github.token do NOT re-trigger
# the PR's CI checks (a maintainer closes and reopens the PR to get them);
# GH_TOKEN below therefore prefers REPO_PLATFORM_TOKEN when it is set.

name: Update Release PR

on:
  workflow_call:
    inputs:
      pr_number:
        description: The release PR's number
        required: true
        type: string
      head_branch:
        description: The release PR's head branch (push updates back to it)
        required: true
        type: string

jobs:
  update-release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # enough to push regenerated files back to the PR branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_branch }}
          # Read-only checkout (push steps authenticate themselves, like
          # auto-format.yml), so no token lingers in git credentials.
          persist-credentials: false
      - name: Update the release PR
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_BRANCH: ${{ inputs.head_branch }}
        # Repository-specific release-PR preparation goes here, e.g.:
        #   ./regenerate-versioned-files.sh
        #   git commit -am "chore: regenerate for release"
        #   git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:"$HEAD_BRANCH"
        run: echo "nothing to add to release PR $PR_NUMBER yet"
