name: installer-sh smoke

# Reusable, single-scenario install.sh smoke. The caller (checks.yml) invokes this
# once per (OS, flag) combination, so each scenario runs as its OWN job on a
# fresh runner -- separate $HOME, separate rc files. Scenarios can never share or
# clobber each other's state, which is exactly why no "strip the marker first"
# dance is needed: a fresh rc has no wiring to begin with, so expect-wiring=false
# can assert the absence directly.
#
# The job compiles this tree's host-target binary and points the installer at it
# through COPILOT_ENV_DOWNLOAD_BASE. So the installer runs its real download,
# verify, and handoff path against the code in the PR -- no published release
# required, and no separate "simulate a release" job.
on:
  workflow_call:
    inputs:
      os:
        description: Runner OS (ubuntu-latest / macos-latest).
        required: true
        type: string
      args:
        description: Flag(s) to pass to install.sh (for example "--no-shell-integration").
        required: true
        type: string
      expect-clis:
        description: true asserts the agent CLIs (claude/copilot/codex) are installed after optional setup; false asserts they are absent.
        type: boolean
        default: false
      setup-clis:
        description: true runs `agent shell --clis --cooldown` after install.
        type: boolean
        default: false
      setup-launchers:
        description: true runs `agent shell --launchers` after install.
        type: boolean
        default: false
      expect-wiring:
        description: true asserts the rc wiring is present; false asserts it is absent.
        type: boolean
        default: true
      rerun:
        description: >-
          true runs install.sh a SECOND time after the first, so the repeat
          install path must still exit 0. Same flag, same job -- no
          cross-scenario interference.
        type: boolean
        default: false

permissions:
  contents: read

env:
  DENO_NO_UPDATE_CHECK: "1"

jobs:
  smoke:
    name: ${{ inputs.os }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc
          cache: true

      - name: Install dependencies
        run: deno ci

      - name: Compile this tree's host binary
        run: |
          triple="$(deno eval 'console.log(Deno.build.target)')"
          deno task compile --target "$triple"

      - name: Run install.sh ${{ inputs.args }}
        run: deno run -P=cli .github/scripts/installer-smoke.ts run-install
        env:
          INSTALLER_ARGS: ${{ inputs.args }}
          RERUN: ${{ inputs.rerun }}
          COPILOT_ENV_DOWNLOAD_BASE: ${{ github.workspace }}/dist

      - name: Assert installer did not install optional CLIs
        run: deno run -P=cli .github/scripts/installer-smoke.ts assert-no-optional-clis
        env:
          INSTALLER_ARGS: ${{ inputs.args }}

      # The INSTALLED agent, not the checkout's launcher: the whole point of
      # these scenarios is that what the installer produced stands on its own.
      - name: Run agent shell --clis
        if: ${{ inputs.setup-clis }}
        run: |
          "$HOME/.copilot-env/bin/agent" shell --clis --cooldown

      - name: Run agent shell --launchers
        if: ${{ inputs.setup-launchers }}
        run: |
          "$HOME/.copilot-env/bin/agent" shell --launchers

      - name: Verify install.sh outcome
        run: deno run -P=cli .github/scripts/installer-smoke.ts verify-outcome
        env:
          INSTALLER_ARGS: ${{ inputs.args }}
          EXPECT_CLIS: ${{ inputs.expect-clis }}
          EXPECT_WIRING: ${{ inputs.expect-wiring }}
          SETUP_LAUNCHERS: ${{ inputs.setup-launchers }}
