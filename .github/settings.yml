# Repository settings, applied remotely by Vivswan/repo-platform's central
# settings-repos run; the file's presence in this repo is the opt-in.
# Undeclared labels are deleted; undeclared rulesets are left alone. This
# file is repo-owned (the settings-sync module is not selected); a central
# settings/repos/copilot-env.yml in repo-platform would win over it if added.

repository:
  description: Local copilot-api proxy lifecycle + config helper (TypeScript).
  homepage: https://github.com/Vivswan/copilot-env
  topics: copilot, copilot-api, cli, bun, typescript, proxy, claude-code, codex
  has_issues: true
  has_wiki: false
  has_projects: false
  has_discussions: false
  default_branch: main
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  # The squash subject must ALWAYS be the PR title (the pr-title check and
  # release-please rely on it); GitHub only defaults to that for
  # single-commit PRs.
  squash_merge_commit_title: PR_TITLE
  squash_merge_commit_message: PR_BODY
  allow_update_branch: true
  delete_branch_on_merge: true
  allow_auto_merge: true
  enable_vulnerability_alerts: true
  enable_automated_security_fixes: true

labels:
  - name: dependencies
    color: "0366d6"
    description: Dependency updates
  # Dependabot's default per-ecosystem labels: without a `labels:` override in
  # dependabot.yml it applies these and recreates them if missing, so leaving
  # them undeclared would make the settings sync delete/recreate them forever.
  - name: github_actions
    color: "000000"
    description: Pull requests that update GitHub Actions code
  - name: javascript
    color: "168700"
    description: Pull requests that update javascript code
  - name: bug
    color: "d73a4a"
    description: Something isn't working
  - name: enhancement
    color: "a2eeef"
    description: New feature or request
  - name: fix-lint
    color: "fbca04"
    description: Lint / formatting fixes
  # release-please manages these two; listing them here keeps the settings
  # sync from deleting them (it removes any label not declared in this file).
  - name: "autorelease: pending"
    color: "ededed"
    description: release-please release PR awaiting merge/tag
  - name: "autorelease: tagged"
    color: "ededed"
    description: release-please release PR has been tagged

# Branch ruleset for the default branch. Admins (RepositoryRole id 5) are in
# the bypass list, so direct pushes to main still work. The single required
# status check is `all-green` (ci.yml), which `needs:` every gating CI job - the
# list stays stable when jobs are added or renamed.
rulesets:
  - name: main
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - "~DEFAULT_BRANCH"
        exclude: []
    rules:
      - type: deletion
      - type: non_fast_forward
      - type: required_linear_history
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: false
          do_not_enforce_on_create: true
          required_status_checks:
            - context: all-green
      - type: code_scanning
        parameters:
          code_scanning_tools:
            - tool: CodeQL
              security_alerts_threshold: high_or_higher
              alerts_threshold: errors
      - type: pull_request
        parameters:
          required_approving_review_count: 0
          dismiss_stale_reviews_on_push: false
          # Require an approving review from a CODEOWNER before merge.
          # Admins in bypass_actors can still merge without one.
          require_code_owner_review: true
          require_last_push_approval: false
          required_review_thread_resolution: false
          # Squash-only merges (enforced by the ruleset, not just repo settings).
          allowed_merge_methods:
            - squash
      # Automatically request Copilot code review on PRs to main, including on
      # each new push and on draft PRs.
      - type: copilot_code_review
        parameters:
          review_on_push: true
          review_draft_pull_requests: true
      # "Require code quality results" is a public-preview rule with no
      # published REST schema; it is live on the repo (enabled by the old
      # settings), so it stays declared to keep the sync from stripping it.
      # `warnings` (plural) is the enum the live API stores.
      - type: code_quality
        parameters:
          severity: warnings
    bypass_actors:
      - actor_id: 5
        actor_type: RepositoryRole
        bypass_mode: always

  # vX.Y.Z release tags are immutable: releases only ever move forward, the
  # installers and `agent update` install by release tag, and repo-platform's
  # push sync pins against them.
  - name: release-tags
    target: tag
    enforcement: active
    conditions:
      ref_name:
        include:
          - v*
        exclude: []
    rules:
      - type: deletion
      - type: non_fast_forward
      - type: update
