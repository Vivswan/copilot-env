# Repo-owned release pipeline, called by the managed ci.yml on top of the
# all-green gate. Generated once by Vivswan/repo-platform and never
# overwritten by template sync. It wraps the managed release-please.yml
# machinery with this repository's release jobs:
#
# - prepare-assets runs BEFORE release-please so a broken installer pin or a
#   broken compile fails the run before anything is tagged. It pins
#   install.sh/install.ps1 to the pending tag (from package.json, already
#   bumped on main by the release PR), cross-compiles the agent binary for
#   every release target, and hands everything to the post-release jobs as
#   run artifacts.
# - release-please-config.json keeps `draft: true`, so merging the release PR
#   creates a DRAFT release; the jobs below upload the assets, smoke the real
#   uploaded binaries and installers on Linux + Windows, and only then flip
#   the release live. A plain push to main releases nothing.
#
# Post-release jobs use the same token expression as the managed machinery
# (REPO_PLATFORM_TOKEN when set, github.token otherwise) so the whole
# pipeline acts under one identity.

name: Release

on:
  workflow_call:

jobs:
  prepare-assets:
    runs-on: ubuntu-latest
    # Five cross-compiles, each downloading its target's denort on a cold cache.
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      # cache: true keys the DENO_DIR cache on deno.lock; the per-target
      # denort archives deno compile downloads land there too.
      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc
          cache: true

      - name: Create installer assets
        id: prepare
        run: |
          tag="v$(jq -r .version package.json)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          deno run --allow-read --allow-write --allow-env .github/scripts/release-assets.ts prepare "$tag"

      - name: Validate installer assets
        env:
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          deno run --allow-read --allow-env .github/scripts/release-assets.ts validate "$TAG"
          bash -n release-assets/install.sh
          pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw release-assets/install.ps1)) | Out-Null"

      - name: Compile agent binaries (all targets)
        run: |
          deno install --frozen
          deno task compile

      - uses: actions/upload-artifact@v7
        with:
          name: installer-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: compiled-binaries
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # The managed machinery: stale-head guard + release-please, which
  # opens/updates the rolling release PR and, when that PR is merged, creates
  # the (draft) release and tag. Outputs: release_created, tag_name.
  release-please:
    needs: prepare-assets
    uses: ./.github/workflows/release-please.yml
    secrets: inherit

  upload-assets:
    name: upload release assets
    needs: [prepare-assets, release-please]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the build-provenance attestation step; the managed ci.yml
      # ceiling grants both.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .dvmrc
          cache: true

      # The assets were pinned and compiled before release-please ran, from
      # the version on the tested tree. If the created tag disagrees,
      # uploading them would publish installers that fetch the wrong
      # release -- fail instead.
      - name: Verify prepared asset tag
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          PREPARED_TAG: ${{ needs.prepare-assets.outputs.tag }}
        run: |
          if [ "$PREPARED_TAG" != "$TAG" ]; then
            echo "::error::prepared installer assets are for $PREPARED_TAG, but release-please created $TAG"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: installer-assets
          path: release-assets

      - uses: actions/download-artifact@v8
        with:
          name: compiled-binaries
          path: dist

      - name: Validate release assets
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          deno run --allow-read --allow-env .github/scripts/release-assets.ts validate "$TAG"
          (cd dist && sha256sum -c checksums.txt)

      # Attest build provenance BEFORE uploading, so nothing unattested is
      # ever published. Anyone can then verify an asset came from this
      # workflow: gh attestation verify <file> -R Vivswan/copilot-env.
      # Attestations only work on public repositories (private needs GitHub
      # Enterprise Cloud).
      - uses: actions/attest-build-provenance@v4
        id: attest
        with:
          subject-path: |
            release-assets/install.sh
            release-assets/install.ps1
            dist/agent-*
            dist/checksums.txt

      # The attestation's Sigstore bundle also ships as a release asset, so
      # any asset can be verified against the frozen release without
      # depending on GitHub's attestations API:
      # `gh attestation verify <asset> -R Vivswan/copilot-env --bundle
      # copilot-env-<tag>.attestation.jsonl`. The bundle is the verification
      # material itself, so it is the one asset without its own attestation.
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "copilot-env-$TAG.attestation.jsonl"
          gh release upload "$TAG" \
            release-assets/install.sh \
            release-assets/install.ps1 \
            dist/agent-* \
            dist/checksums.txt \
            "copilot-env-$TAG.attestation.jsonl" \
            --clobber

  # Post-release gate: verify and run the REAL uploaded binary, then the REAL
  # uploaded installer end to end, on both platforms before the draft release
  # goes live. COPILOT_ENV_DOWNLOAD_BASE points the installer at the assets
  # gh already downloaded (draft assets are invisible to the installer's
  # public release URL until the release is published).
  #
  # Everything here installs into RUNNER_TEMP and only reads. Do NOT add a step
  # that runs `agent update` or `agent-bin __migrate` for real: migrations mutate
  # the invoking HOME (agent configs, credential store, shell rc files) and have
  # no dry-run, so on a runner they would rewrite state no assertion here owns.
  # The update path is covered by test/update_apply.test.ts, which drives it
  # against a throwaway root.
  release-installer-smoke:
    name: release installer smoke / ${{ matrix.os }}
    needs: [release-please, upload-assets]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: agent-x86_64-unknown-linux-gnu
          - os: windows-latest
            asset: agent-x86_64-pc-windows-msvc.exe
    permissions:
      contents: write # draft releases are only visible to tokens with push access
    steps:
      - name: Download the uploaded release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          mkdir release-smoke-assets
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --dir release-smoke-assets \
            --pattern 'install.sh' --pattern 'install.ps1' \
            --pattern 'agent-*' --pattern 'checksums.txt'

      - name: Verify uploaded checksums
        shell: bash
        run: cd release-smoke-assets && sha256sum -c checksums.txt

      - name: Run the uploaded binary
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          chmod +x "release-smoke-assets/$ASSET"
          "./release-smoke-assets/$ASSET" --help
          "./release-smoke-assets/$ASSET" env

      - name: Run the uploaded installer end to end
        if: runner.os == 'Linux'
        env:
          COPILOT_ENV_DOWNLOAD_BASE: ${{ github.workspace }}/release-smoke-assets
        run: |
          bash release-smoke-assets/install.sh --dir "$RUNNER_TEMP/copilot-env" --no-shell-integration
          "$RUNNER_TEMP/copilot-env/bin/agent" --help

      - name: Run the uploaded installer end to end
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          COPILOT_ENV_DOWNLOAD_BASE: ${{ github.workspace }}\release-smoke-assets
        run: |
          pwsh -NoProfile -File release-smoke-assets/install.ps1 -InstallDir "$env:RUNNER_TEMP\copilot-env" -NoShellIntegration
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\copilot-env\bin\agent.ps1" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  publish-release:
    name: publish release
    needs: [release-please, release-installer-smoke]
    if: >-
      ${{
        needs.release-please.outputs.release_created == 'true' &&
        needs.release-installer-smoke.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --prerelease=false --latest
